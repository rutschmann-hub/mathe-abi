<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathe-Abi Countdown 2026</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #d9a226 0%, #efc958 100%);
        }

        .card {
            width: min(720px, 100%);
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.16);
            padding: 24px;
            text-align: center;
        }

        h1 {
            color: #7b5300;
            font-size: clamp(1.5rem, 3vw, 2rem);
            margin-bottom: 8px;
        }

        .date {
            color: #8a6b2d;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
        }

        .box {
            background: linear-gradient(135deg, #d99b33, #b67814);
            color: white;
            border-radius: 10px;
            padding: 14px 8px;
        }

        .val {
            font-size: clamp(1.6rem, 4vw, 2.2rem);
            font-weight: 700;
            line-height: 1.1;
        }

        .lbl {
            margin-top: 4px;
            font-size: 0.75rem;
            opacity: 0.92;
        }

        .status {
            margin-top: 16px;
            color: #6a4f10;
            font-weight: 600;
        }

        @media (max-width: 560px) {
            .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Mathe-Abi Countdown</h1>
        <p class="date">Mittwoch, 6. Mai 2026 um 09:00 Uhr</p>

        <section class="grid" aria-label="Countdown bis zur Mathe-Prüfung">
            <div class="box">
                <div class="val" id="days">0</div>
                <div class="lbl">Tage</div>
            </div>
            <div class="box">
                <div class="val" id="hours">00</div>
                <div class="lbl">Stunden</div>
            </div>
            <div class="box">
                <div class="val" id="minutes">00</div>
                <div class="lbl">Minuten</div>
            </div>
            <div class="box">
                <div class="val" id="seconds">00</div>
                <div class="lbl">Sekunden</div>
            </div>
        </section>

        <p class="status" id="status">Noch Zeit bis zur Prüfung.</p>
    </main>

    <script>
        const examDate = new Date('2026-05-06T09:00:00');

        function pad(n) {
            return String(n).padStart(2, '0');
        }

        function updateCountdown() {
            const now = new Date();
            const diff = examDate - now;

            const daysEl = document.getElementById('days');
            const hoursEl = document.getElementById('hours');
            const minutesEl = document.getElementById('minutes');
            const secondsEl = document.getElementById('seconds');
            const statusEl = document.getElementById('status');

            if (diff <= 0) {
                daysEl.textContent = '0';
                hoursEl.textContent = '00';
                minutesEl.textContent = '00';
                secondsEl.textContent = '00';
                statusEl.textContent = 'Die Mathe-Prüfung läuft/ist vorbei. Viel Erfolg gehabt!';
                return;
            }

            const days = Math.floor(diff / 864e5);
            const hours = Math.floor((diff % 864e5) / 36e5);
            const minutes = Math.floor((diff % 36e5) / 6e4);
            const seconds = Math.floor((diff % 6e4) / 1e3);

            daysEl.textContent = String(days);
            hoursEl.textContent = pad(hours);
            minutesEl.textContent = pad(minutes);
            secondsEl.textContent = pad(seconds);
            statusEl.textContent = 'Noch Zeit bis zur Prüfung.';
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
