<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Mathe-Abi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .countdown-card {
            background: white;
            border-radius: 20px;
            padding: 40px 50px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .title {
            font-size: 1.8em;
            color: #2c3e50;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 1em;
            margin-bottom: 30px;
        }

        .countdown-items {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .countdown-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            transition: transform 0.2s ease;
        }

        .countdown-item:hover {
            transform: translateX(5px);
        }

        .time-label {
            font-size: 1em;
            font-weight: 500;
            text-align: left;
        }

        .time-value {
            font-size: 2.2em;
            font-weight: 700;
            min-width: 70px;
            text-align: right;
        }

        .date-display {
            margin-top: 25px;
            padding-top: 25px;
            border-top: 2px solid #ecf0f1;
            color: #7f8c8d;
            font-size: 0.9em;
        }

        .date-display strong {
            color: #2c3e50;
            display: block;
            margin-top: 5px;
            font-size: 1.1em;
        }

        .finished {
            font-size: 1.8em;
            color: #667eea;
            font-weight: 700;
            padding: 40px 20px;
            animation: celebration 1.5s ease-in-out infinite;
        }

        @keyframes celebration {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @media (max-width: 400px) {
            .countdown-card {
                padding: 30px 25px;
            }

            .title {
                font-size: 1.5em;
            }

            .time-value {
                font-size: 1.8em;
            }

            .countdown-items {
                gap: 10px;
            }

            .countdown-item {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="countdown-card">
        <div class="title">📐 Mathe-Abi</div>
        <div class="subtitle">Noch bis zur Prüfung:</div>
        
        <div id="countdown" class="countdown-items">
            <div class="countdown-item">
                <span class="time-label">Tage</span>
                <span class="time-value" id="days">0</span>
            </div>
            <div class="countdown-item">
                <span class="time-label">Stunden</span>
                <span class="time-value" id="hours">0</span>
            </div>
            <div class="countdown-item">
                <span class="time-label">Minuten</span>
                <span class="time-value" id="minutes">0</span>
            </div>
            <div class="countdown-item">
                <span class="time-label">Sekunden</span>
                <span class="time-value" id="seconds">0</span>
            </div>
        </div>

        <div class="date-display">
            Prüfungsbeginn:
            <strong>Dienstag, 6. Mai 2026, 9:00 Uhr</strong>
        </div>
    </div>

    <script>
        const targetDate = new Date('2026-05-06T09:00:00');

        function updateCountdown() {
            const now = new Date();
            const difference = targetDate - now;

            if (difference <= 0) {
                document.getElementById('countdown').innerHTML = 
                    '<div class="finished">🎉 Viel Erfolg bei der Prüfung! 🎉</div>';
                return;
            }

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = days;
            document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
            document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
            document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
        }

        updateCountdown();
        setInterval(updateCountdown, 1000); // Update jede Sekunde
    </script>
</body>
</html>
